name: Checks

# Проверка статичного сайта: на каждый pull request в ветку new-site и на каждый push в неё.
# Браузер не нужен: tests/check_site.py проверяет данные, свежесть собранных страниц, ссылки и теги за секунды.
on:
  pull_request:
    branches: ["new-site"]
  push:
    branches: ["new-site"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Сайт в порядке
        run: python3 tests/check_site.py
