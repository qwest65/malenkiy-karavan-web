name: Release

# После каждого слияния PR в new-site создаёт релиз с меткой site-v<версия> (версия из data/site.json).
# К метке можно откатиться; метка не «последний релиз», чтобы не подменять релизы основного сайта в этом репозитории.
on:
  push:
    branches: ["new-site"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-new-site
  cancel-in-progress: false

jobs:
  release:
    # только слияния PR (не одиночные коммиты)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/make_release.sh
