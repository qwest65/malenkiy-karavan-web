name: Release

# После каждого слияния PR в main создаёт релиз на GitHub (Releases) с меткой версии: v1.30, v1.30.1 …
# К метке можно откатить сайт или, наоборот, обновить. Как — в README, раздел «Версии и откат».
# При первом запуске также ставит метки на прошлые версии 1.24…1.29.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # только слияния PR (не автоматические коммиты вроде «Отзыв #…», карты, озвучки, статистики)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo '--- создаём тестовый релиз'
          gh api -i -X POST repos/$GITHUB_REPOSITORY/releases -f tag_name=diag-test -f target_commitish=$GITHUB_SHA -f name=diag -F draft=true 2>&1 | head -30
          echo '--- права токена'
          gh api -i repos/$GITHUB_REPOSITORY 2>&1 | grep -i 'x-accepted\|x-oauth\|permission' | head
          echo '--- метка через git'
          git tag diag-tag && git push origin diag-tag 2>&1 | tail -3; git push origin :refs/tags/diag-tag 2>&1 | tail -1
          exit 0
