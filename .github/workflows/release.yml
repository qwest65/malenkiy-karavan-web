name: Release

# После каждого слияния PR в main создаёт релиз на GitHub (Releases) с меткой версии: v1.30, v1.30.1 …
# К метке можно откатить сайт или, наоборот, обновить. Как — в README, раздел «Версии и откат».
# При первом запуске также ставит метки на прошлые версии 1.24…1.29.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # только слияния PR (не автоматические коммиты вроде «Отзыв #…», карты, озвучки, статистики)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh release delete diag-test -y --cleanup-tag 2>&1 | tail -2
          gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/441972974 2>&1 | tail -2
          echo '--- A: релиз на старый коммит 3520fae (публикация)'
          gh release create diag-old --target 3520fae9f0d9ee199acaa45f133d2bfe42825e7e --title diagold --notes x 2>&1 | tail -3
          echo '--- B: релиз на текущий коммит'
          gh release create diag-new --target $GITHUB_SHA --title diagnew --notes x 2>&1 | tail -3
          echo '--- C: метка на старый коммит через git'
          git tag diag-c 3520fae9f0d9ee199acaa45f133d2bfe42825e7e && git push origin diag-c 2>&1 | tail -2
          echo '--- очистка'
          for t in diag-old diag-new; do gh release delete $t -y --cleanup-tag 2>&1 | tail -1; done
          git push origin :refs/tags/diag-c 2>&1 | tail -1
          gh release list 2>&1 | head
          exit 0
