name: Deploy

# Выкладка сайта на хостинг (Cloud4box, ISPmanager) по FTPS (tools/deploy_ftp.py): там у сайта свой сертификат
# Let's Encrypt, и он открывается из России без VPN. GitHub Pages остаётся запасной копией.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   FTP_SERVER   — адрес FTP-сервера из письма или панели хостинга;
#   FTP_USERNAME — FTP-пользователь, у которого домашняя папка — папка сайта;
#   FTP_PASSWORD — его пароль.
# Пока секретов нет, workflow ничего не делает.
#
# Запускается после каждого push в main и после workflow, которые сами коммитят в main
# (их push от github-actions[bot] не запускает другие workflow).
on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Map", "Walking paths", "Voice"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Секреты на месте?
        id: secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "Нет секрета FTP_SERVER — выкладка на хостинг пропущена."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: main

      - name: Файлы и данные на месте
        if: steps.secrets.outputs.ready == 'true'
        run: python3 tests/check_files.py

      - name: Залить на хостинг
        if: steps.secrets.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 tools/deploy_ftp.py

      # IndexNow: сообщаем Яндексу (и Bing), что страницы обновились, — так они быстрее попадают в поиск.
      # Ключ — имя и содержимое файла 2d3d361ce742b2b5b9e2cbaeeaced98e.txt в корне сайта.
      - name: Сообщить поисковикам
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        run: |
          H=xn----7sbbaalryjidglrj8b2n.xn--p1ai
          KEY=2d3d361ce742b2b5b9e2cbaeeaced98e
          BODY="{\"host\":\"$H\",\"key\":\"$KEY\",\"keyLocation\":\"https://$H/$KEY.txt\",\"urlList\":[\"https://$H/\",\"https://$H/progulka/\",\"https://$H/site/privacy.html\"]}"
          for api in https://yandex.com/indexnow https://api.indexnow.org/indexnow; do
            echo "$api: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' -d "$BODY" "$api")"
          done

      # Сайт открывается после выкладки — и так, как его видят роботы мессенджеров (карточки ссылок).
      - name: Проверить сайт
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        run: |
          H=https://xn----7sbbaalryjidglrj8b2n.xn--p1ai
          # Поисковые роботы — первыми: если хостинг их не пускает, сайт не попадёт в поиск.
          for ua in "Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)" "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"; do
            for u in $H/ $H/robots.txt $H/sitemap.xml; do
              printf "%-12s %-14s " "${ua:25:9}" "${u#$H}"
              curl -s -o /dev/null -A "$ua" -w "%{http_code} %{content_type} %{size_download}B %{time_total}s" "$u"; echo
            done
          done
          for ua in "Mozilla/5.0" "TelegramBot (like TwitterBot)" "WhatsApp/2.23" "facebookexternalhit/1.1"; do
            for u in $H/ $H/progulka/ $H/site/images/og.jpg $H/images/og.jpg; do
              printf "%-32s %-45s " "$ua" "${u#$H}"
              curl -s -o /tmp/body -A "$ua" -w "%{http_code} %{content_type} %{size_download}B %{time_total}s" "$u"; echo
            done
          done
          curl -s -A "TelegramBot (like TwitterBot)" $H/ | grep -o '<meta property="og:[a-z:]*" content="[^"]*"' | head -5
          curl -sI -A "TelegramBot (like TwitterBot)" $H/ | head -20

