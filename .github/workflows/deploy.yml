name: Deploy

# Выкладка сайта на хостинг (Cloud4box, ISPmanager) по FTPS через lftp: там у сайта свой сертификат
# Let's Encrypt, и он открывается из России без VPN. GitHub Pages остаётся запасной копией.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   FTP_SERVER   — адрес FTP-сервера из письма или панели хостинга;
#   FTP_USERNAME — FTP-пользователь, у которого домашняя папка — папка сайта;
#   FTP_PASSWORD — его пароль.
# Пока секретов нет, workflow ничего не делает.
#
# Запускается после каждого push в main и после workflow, которые сами коммитят в main
# (их push от github-actions[bot] не запускает другие workflow).
on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Map", "Walking paths", "Voice"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Секреты на месте?
        id: secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "Нет секрета FTP_SERVER — выкладка на хостинг пропущена."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: main
          fetch-depth: 0

      - name: Файлы и данные на месте
        if: steps.secrets.outputs.ready == 'true'
        run: python3 tests/check_files.py

      # Время файла = время его последнего коммита: тогда lftp заливает только изменённые файлы.
      - name: Время файлов из истории
        if: steps.secrets.outputs.ready == 'true'
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            touch -d "@$(git log -1 --format=%ct -- "$f")" "$f"
          done

      # lftp, а не готовый action: хостинг иногда отказывает в соединении для передачи (425),
      # lftp переподключается и продолжает с того же места.
      - name: Залить на хостинг
        if: steps.secrets.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq lftp >/dev/null
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 30
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set net:persist-retries 30
          open --env-password -u "$FTP_USERNAME" "$FTP_SERVER"
          mirror -R --only-newer --parallel=1 --verbose=1 -x '^\.git' -x '^tools/' -x '^tests/' -x '^reviews/' -x '^samples/' -x '__pycache__' -x '^README\.md$' -x '^CNAME$' ./ ./
          EOF
