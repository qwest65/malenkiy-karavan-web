name: Deploy

# Сайт живёт на своём сервере: сервер сам забирает ветку main раз в 2 минуты (с 4 ноября 2026).
# Этот workflow после каждого изменения в main:
#   1) проверяет файлы и данные;
#   2) ждёт, пока новая версия появится на сайте (сверяет несколько файлов с сайтом);
#   3) сообщает Яндексу и Bing, что страницы обновились (IndexNow), и проверяет сайт глазами роботов.
# Выкладка по FTPS на прежний хостинг (Cloud4box, tools/deploy_ftp.py) — только пока заданы секреты
# FTP_SERVER, FTP_USERNAME, FTP_PASSWORD; когда хостинг не нужен — удалить их, остальное продолжит работать.
#
# Запускается после каждого push в main и после workflow, которые сами коммитят в main
# (их push от github-actions[bot] не запускает другие workflow).
on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Map", "Walking paths", "Voice"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE: https://xn----7sbbaalryjidglrj8b2n.xn--p1ai
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Файлы и данные на месте
        run: python3 tests/check_files.py

      - name: Залить на прежний хостинг (пока есть секреты FTP)
        if: env.HAS_FTP == 'true'
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 tools/deploy_ftp.py

      # Сервер забирает main раз в 2 минуты. Ждём, пока сайт отдаст ровно эти файлы — не дольше 6 минут.
      # В журнал пишется, что отвечает сайт (код, время, адрес), — если не дождались, видно почему.
      - name: Дождаться новой версии на сайте
        continue-on-error: true
        timeout-minutes: 8
        run: |
          getent ahostsv4 "${SITE#https://}" | head -1 || true
          end=$((SECONDS + 360)); i=0
          while [ $SECONDS -lt $end ]; do
            i=$((i + 1)); ok=1
            for f in index.html progulka/index.html progulka/sw.js data/files.json; do
              info=$(curl -s -o body --connect-timeout 5 --max-time 15 -w '%{http_code} %{time_total}s %{remote_ip}' "$SITE/$f" || true)
              if [ "$(sha256sum < body)" != "$(sha256sum < "$f")" ]; then ok=0; echo "попытка $i: $f — $info, не совпадает"; break; fi
            done
            if [ "$ok" = 1 ]; then echo "Новая версия на сайте (попытка $i)."; exit 0; fi
            sleep 20
          done
          echo "::warning::За 6 минут сайт не показал новую версию — см. строки выше (код ответа и адрес)."
          exit 1

      # IndexNow: сообщаем Яндексу (и Bing), что страницы обновились, — так они быстрее попадают в поиск.
      # Ключ — имя и содержимое файла 2d3d361ce742b2b5b9e2cbaeeaced98e.txt в корне сайта.
      - name: Сообщить поисковикам
        continue-on-error: true
        run: |
          H=${SITE#https://}
          KEY=2d3d361ce742b2b5b9e2cbaeeaced98e
          BODY="{\"host\":\"$H\",\"key\":\"$KEY\",\"keyLocation\":\"https://$H/$KEY.txt\",\"urlList\":[\"https://$H/\",\"https://$H/progulka/\",\"https://$H/site/privacy.html\"]}"
          for api in https://yandex.com/indexnow https://api.indexnow.org/indexnow; do
            echo "$api: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' -d "$BODY" -m 30 "$api")"
          done

      # Сайт открывается — и так, как его видят роботы поисковиков и мессенджеров (карточки ссылок).
      - name: Проверить сайт
        continue-on-error: true
        run: |
          H=$SITE
          # Поисковые роботы — первыми: если сервер их не пускает, сайт не попадёт в поиск.
          for ua in "Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)" "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"; do
            for u in $H/ $H/robots.txt $H/sitemap.xml; do
              printf "%-12s %-14s " "${ua:25:9}" "${u#$H}"
              curl -s -m 20 -o /dev/null -A "$ua" -w "%{http_code} %{content_type} %{size_download}B %{time_total}s" "$u"; echo
            done
          done
          for ua in "Mozilla/5.0" "TelegramBot (like TwitterBot)" "WhatsApp/2.23" "facebookexternalhit/1.1"; do
            for u in $H/ $H/progulka/ $H/site/images/og.jpg $H/images/og.jpg; do
              printf "%-32s %-45s " "$ua" "${u#$H}"
              curl -s -m 20 -o /tmp/body -A "$ua" -w "%{http_code} %{content_type} %{size_download}B %{time_total}s" "$u"; echo
            done
          done
          curl -s -m 20 -A "TelegramBot (like TwitterBot)" $H/ | grep -o '<meta property="og:[a-z:]*" content="[^"]*"' | head -5
          curl -sI -m 20 -A "TelegramBot (like TwitterBot)" $H/ | head -20
